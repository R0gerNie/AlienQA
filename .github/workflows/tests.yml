name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      framework_smoke:
        description: Run explicitly prepared locked React/Vue/Next fixtures
        type: boolean
        default: false
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.venv/browsers
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -e '.[dev]' -c requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest --cov=alienqa --cov-report=term-missing --cov-report=xml --junitxml=artifacts/ci/default.xml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.python }}
          path: |
            artifacts/ci/default.xml
            coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.python }}
          path: dist/*
  installation:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: distribution-3.11
          path: artifacts/ci/distribution
      - run: python -m pip install -c requirements-dev.lock playwright
      - run: python -m playwright install-deps chromium
      - run: python scripts/verify_t09_distribution.py --wheel artifacts/ci/distribution/alienqa-0.1.0-py3-none-any.whl --sdist artifacts/ci/distribution/alienqa-0.1.0.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-installation
          path: |
            artifacts/evaluation/t09-installation/**/summary.json
            artifacts/evaluation/t09-installation/*.log
            artifacts/evaluation/t09-installation/**/*.log
  frameworks:
    if: github.event_name == 'workflow_dispatch' && inputs.framework_smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '25.1.0'
      - run: python -m pip install -e '.[dev]' -c requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/prepare_t02_frameworks.py --install
      - run: python scripts/prepare_t01_frameworks.py
      - run: python -m pytest tests/test_t02_frameworks.py tests/test_t01_frameworks.py --run-frameworks --junitxml=artifacts/ci/frameworks.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locked-framework-mechanisms
          path: artifacts/ci/frameworks.xml
