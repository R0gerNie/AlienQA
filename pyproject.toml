[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alienqa"
version = "0.1.0"
description = "AlienQA：面向独立开发者的本机 QA 与一般用户认知分析，提供可回放证据、人工审核和离线报告"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.100",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "flask>=3.0",
    "playwright>=1.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
]

[tool.setuptools.packages.find]
include = ["alienqa*"]

[tool.setuptools.package-data]
"alienqa.ui" = ["templates/*.html"]
"alienqa.review" = ["templates/*.html"]

[tool.setuptools.data-files]
"share/alienqa" = ["config/config.yaml", "config/codex.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["baseline: tests requiring externally cloned application repositories"]

[tool.coverage.run]
source = ["alienqa"]

[tool.coverage.report]
fail_under = 80
show_missing = true
