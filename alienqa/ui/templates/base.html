<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>AlienQA 控制台</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; color: #1f2328; }
    nav { background: #24292f; color: #fff; padding: .6em 1.2em; display: flex; gap: 1.2em; }
    nav a { color: #fff; text-decoration: none; }
    nav a.active { font-weight: 700; border-bottom: 2px solid #58a6ff; }
    main { max-width: 980px; margin: 1.5rem auto; padding: 0 1rem; }
    h1 { border-bottom: 2px solid #1f2328; padding-bottom: .3em; }
    h2 { margin-top: 1.6em; }
    label { display: block; margin: .9em 0 .25em; font-weight: 600; }
    input[type=text], input[type=password], textarea {
      width: 100%; max-width: 560px; padding: .45em .6em;
      border: 1px solid #d0d7de; border-radius: 6px; font: inherit;
    }
    button { background: #0969da; color: #fff; border: 0; border-radius: 6px;
             padding: .5em 1.2em; cursor: pointer; font: inherit; }
    button.secondary { background: #57606a; }
    table { border-collapse: collapse; width: 100%; margin-top: 1em; }
    th, td { border: 1px solid #d0d7de; padding: .5em .7em; text-align: left; vertical-align: top; }
    th { background: #f6f8fa; }
    .muted { color: #57606a; }
    .badge { padding: .15em .6em; border-radius: 999px; font-size: .85em; }
    .badge.done { background: #dafbe1; color: #1a7f37; }
    .badge.error { background: #ffebe9; color: #cf222e; }
    .badge.running { background: #ddf4ff; color: #0969da; }
    .badge.unknown { background: #f6f8fa; color: #57606a; }
    .badge.timeout { background: #fff8c5; color: #9a6700; }
    code { background: #f6f8fa; padding: .1em .35em; border-radius: 4px; }
    a { color: #0969da; }
    .toolbar a { margin-right: 1.2em; text-decoration: none; color: #0969da; }
    .toolbar a.active { font-weight: 700; text-decoration: underline; }
    .switch { text-align: center; white-space: nowrap; }
    .toggle { position: relative; display: inline-block; width: 52px; height: 26px; vertical-align: middle; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #d1242f; border-radius: 26px; transition: .2s; }
    .slider::before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .toggle input:checked + .slider { background: #1a7f37; }
    .toggle input:checked + .slider::before { transform: translateX(26px); }
    .sw-label { display: inline-block; min-width: 3.5em; margin-left: .5em; font-weight: 700; vertical-align: middle; }
    .sw-label.on { color: #1a7f37; }
    .sw-label.off { color: #d1242f; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="{{ 'active' if active == 'run' }}">运行扫描</a>
    <a href="/history" class="{{ 'active' if active == 'history' }}">历史项目</a>
    <a href="/settings" class="{{ 'active' if active == 'settings' }}">设置（密钥）</a>
  </nav>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
